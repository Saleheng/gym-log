<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="theme-color" content="#21232B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* layout: one centred column. Date bar and seven day strip on top, full width section switch, then exercises stacked in training order */
:root{
  color-scheme:dark;
  --bg:#21232B;--surface:#2A2D37;--raised:#333743;--line:#3E4351;--line-soft:#32363F;
  --text:#EDEFF5;--text-dim:#99A0B0;--ink:#15171D;
  --cyan:#22D3EE;--lime:#A3E635;--magenta:#F0459B;--amber:#FBBF24;--violet:#A78BFA;--coral:#FB7185;
  --acc:var(--cyan);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Roboto Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
[data-acc="lift"]{--acc:var(--cyan)}
[data-acc="mob"]{--acc:var(--magenta)}
[data-acc="body"]{--acc:var(--violet)}
[data-acc="more"]{--acc:var(--amber)}
[data-acc="quit"]{--acc:var(--lime)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.bar1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:600 22px/1 var(--cond);letter-spacing:-.01em;margin:0;margin-right:auto}
.brand b{color:var(--cyan);font-weight:600}
.datenav{display:flex;align-items:center;gap:6px;flex:none}
.datenav button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 18px var(--mono);transition:border-color .12s}
.datenav button:hover{border-color:var(--text-dim)}
.datenav .now{width:auto;padding:0 12px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.curdate{font:500 15px var(--mono);min-width:13ch;text-align:center}
.chip{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--raised);color:var(--text-dim);white-space:nowrap}
.chip.ok{color:var(--lime)}
.chip.err{background:var(--coral);color:var(--ink)}
.rest{border:0;background:var(--cyan);color:var(--ink);font:600 13px var(--mono);padding:8px 14px;border-radius:999px}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px 8px 7px;border-radius:8px;border:1px solid transparent;background:var(--surface);min-width:0;transition:transform .12s,border-color .12s}
.day:hover{transform:translateY(-1px);border-color:var(--line)}
.day .d1{display:flex;justify-content:space-between;gap:4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.day .d2{font:600 14px/1.15 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cyan)}
.day.off .d2{color:var(--text-dim);font-weight:500}
.day.sel{border-color:var(--text);background:var(--raised)}
.day.sel .d1{color:var(--text)}
.meter{height:4px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .2s}
.dots{display:flex;gap:6px;font:500 9px var(--mono);letter-spacing:.08em;color:var(--line)}
.dots .on{color:var(--magenta)}

/* section switch and session switch fill the row */
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tabs{padding-block:6px 4px}
.seg button{height:50px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 16px var(--cond);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:color .12s,border-color .12s,transform .12s}
.seg button:hover{color:var(--text);border-color:var(--text-dim);transform:translateY(-1px)}
.tabs button[data-tab="lift"]{--acc:var(--cyan)}
.tabs button[data-tab="mob"]{--acc:var(--magenta)}
.tabs button[data-tab="body"]{--acc:var(--violet)}
.tabs button[data-tab="more"]{--acc:var(--amber)}
.tabs button[data-tab="quit"]{--acc:var(--lime)}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.pick{padding-top:12px}
.pick button{height:44px;font-size:15px}
.pick button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--raised)}

.head{padding-block:20px 6px;display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head h2{font:600 34px/1.05 var(--cond);letter-spacing:-.015em;margin:0;color:var(--acc);text-wrap:balance}
.head p{margin:0;color:var(--text-dim);max-width:68ch}
.total{font:500 22px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.total small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.big{height:10px;border-radius:999px;background:var(--surface);overflow:hidden}
.big i{display:block;height:100%;border-radius:999px;background:var(--lime);transition:width .25s}
.note{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;color:var(--text-dim);margin-block:10px 4px;max-width:none}
.note b{color:var(--text);font-weight:500}
.grp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.grp h3{font:600 20px var(--cond);margin:0}
.grp span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}

/* exercises: one per row, numbered in the order you train them */
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ex{background:var(--surface);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid transparent;transition:border-color .15s,box-shadow .15s}
.ex.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 18px -4px var(--acc)}
.badge{flex:none;width:48px;height:48px;border-radius:8px;background:var(--acc);color:var(--ink);font:600 20px var(--mono);display:grid;place-items:center;transition:background .15s}
.ex.done .badge{background:var(--lime)}
.ex.done{border-color:var(--line)}
.exhead{display:flex;justify-content:center;align-items:center;gap:14px;min-width:0}
.extitle{display:flex;flex-direction:column;gap:4px;min-width:0}
.exh{min-width:0}
.exh h3{font:600 21px/1.2 var(--cond);margin:0}
.exh a{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;white-space:nowrap;padding:6px 0}
.exh a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.goal{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--raised);color:var(--text-dim)}
.ex.next .tag.up{background:var(--acc);color:var(--ink)}
.tag.up{display:none}.ex.next .tag.up{display:inline-block}
.eq{color:var(--text-dim);font-size:14px}
.exbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.cue{margin:0;font-size:14.5px;max-width:68ch}
.last{margin:0;font:400 12.5px var(--mono);color:var(--text-dim)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.sethead{display:grid;grid-template-columns:40px 96px minmax(0,1fr) 104px;gap:8px;align-items:center}
.nokg .set,.nokg .sethead{grid-template-columns:40px 96px minmax(0,1fr)}
.sethead span{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-align:center}
.sethead .ht{color:var(--acc)}
.set .n{font:500 14px var(--mono);color:var(--text-dim);text-align:center;height:50px;line-height:50px;border-radius:6px;background:var(--bg)}
.set input{width:100%;min-width:0;height:50px;border-radius:6px;border:1px solid var(--line);background:var(--raised);text-align:center;font:500 19px var(--mono);font-variant-numeric:tabular-nums;padding:0 2px;-moz-appearance:textfield;appearance:textfield}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input::placeholder{color:var(--line)}
.set input.t{color:var(--acc);background:transparent;border-color:var(--acc);border-style:dashed}
.set input:focus{border-color:var(--text);border-style:solid;outline:none}
.step{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px}
.step button{height:50px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font:500 22px var(--mono);color:var(--text);transition:border-color .12s,transform .12s}
.step button:hover{border-color:var(--acc)}
.step button:active{transform:scale(.96)}
.set.hit input.a{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.set.hit .n{background:var(--lime);color:var(--ink)}
.set.short input.a{border-color:var(--amber);color:var(--amber)}
.foot{display:flex;align-items:center;gap:10px}
.foot .meter{flex:1;height:6px;background:var(--bg)}
.foot .meter.short i{background:var(--amber)}
.foot span{font:500 12px var(--mono);color:var(--text-dim);white-space:nowrap}

.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.panel{background:var(--surface);border-radius:8px;padding:16px;min-width:0}
.panel h3{font:600 19px var(--cond);margin:0 0 12px}
.panel p{margin:0 0 10px;max-width:68ch}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px}
.form .full{grid-column:1/-1}
.form input{height:52px;border-radius:6px;border:1px solid var(--line);background:var(--raised);padding:0 12px;font:500 19px var(--mono);width:100%;min-width:0}
.form input:focus{border-color:var(--acc);outline:none}
.go{height:52px;border:0;border-radius:6px;background:var(--acc);color:var(--ink);font:600 17px var(--cond);padding:0 18px;transition:transform .12s}
.go:hover{transform:translateY(-1px)}
.go.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px}
.stat b{display:block;font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--violet)}
.stat b small{font-size:13px;color:var(--text-dim);font-weight:400}
.chart{width:100%;height:auto;display:block}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft);font:400 14px var(--mono);font-variant-numeric:tabular-nums}
.row:first-child{border-top:0}
.row button{height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:transparent;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.row button.armed{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.empty{color:var(--text-dim);margin:0}
.msg{font:500 13px var(--mono);color:var(--lime);margin:10px 0 0;min-height:1.4em}
.msg.bad{color:var(--coral)}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.sched{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.sched dt{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding-top:2px}
.sched dd{margin:0}

/* demo loop, centred above the sets */
.demo{width:min(100%,380px);margin:0 auto;aspect-ratio:3/2;border-radius:8px;background-color:var(--bg);background-size:200% 100%;background-position:0 0;background-repeat:no-repeat;border:1px solid var(--line)}
.f2 .demo{background-position:100% 0}
.yt{position:relative;width:min(100%,380px);margin:0 auto;aspect-ratio:16/9;border-radius:8px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;color:var(--text);padding:0;display:grid;place-items:center;overflow:hidden}
.yt svg{width:64px;height:64px;color:var(--acc);filter:drop-shadow(0 2px 10px #000)}
.ytframe{width:min(100%,560px);margin:0 auto;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
.ytframe iframe{width:100%;height:100%;border:0;display:block}
.ytopen{align-self:center;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:6px 0}
.last{text-align:center}
/* trend, suggestion, notes, soccer, photos, backup nudge, craving patterns */
.trend{display:flex;align-items:center;justify-content:center;gap:10px;font:500 12px var(--mono);color:var(--text-dim)}
.trend svg{width:120px;height:30px;flex:none}
.trend b{color:var(--text);font-weight:500}
.sug{align-self:center;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--amber);background:transparent;color:var(--amber);font:600 15px var(--cond);transition:transform .12s}
.sug:hover{transform:translateY(-1px)}
.panel textarea{width:100%;min-height:90px;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:inherit;padding:10px 12px;resize:vertical}
.panel textarea:focus{border-color:var(--acc);outline:none}
.nudge{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid var(--amber);border-radius:8px;padding:10px 14px;margin-top:14px}
.nudge span{flex:1 1 200px;min-width:0}
.nudge button{height:40px;padding:0 14px;border-radius:6px;border:0;background:var(--amber);color:var(--ink);font:600 15px var(--cond)}
.nudge button.ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim)}
.pick4{grid-auto-columns:minmax(0,1fr)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.photos button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photos span{font:500 11px var(--mono);color:var(--text-dim);padding:5px;text-align:center}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.compare figure{margin:0}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.compare figcaption{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding-top:5px;text-align:center}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(15,16,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:78vh;border-radius:8px}
.viewer div{display:flex;gap:10px}
.trigs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 14px}
.trigs button{height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font:500 14px var(--sans);color:var(--text-dim)}
.trigs button[aria-pressed="true"]{border-color:var(--magenta);color:var(--magenta)}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.bars i{display:block;height:10px;border-radius:999px;background:var(--magenta)}
.bars b{font:500 13px var(--mono)}
.qstep{margin:6px 0 12px;grid-template-columns:64px minmax(0,1fr) 64px}
.qstep button,.qstep input{height:56px}
.qstep input{width:100%;min-width:0;border-radius:6px;border:1px solid var(--line);background:var(--raised);text-align:center;font:500 24px var(--mono);-moz-appearance:textfield;appearance:textfield}
.qstep input::-webkit-outer-spin-button,.qstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qpack{width:100%}
.qpack[aria-pressed="true"]{background:var(--coral)}
.deload{border-color:var(--lime);margin-top:12px}
.deload b{color:var(--lime)}
.wk{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.moves button{height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--raised);font:500 14px var(--mono)}
.moves button:hover{border-color:var(--acc)}
/* session stopwatch */
.sw{display:flex;align-items:center;gap:6px;flex:none}
.swgo{height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 16px var(--mono);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;transition:border-color .12s}
.swgo:hover{border-color:var(--lime)}
.swgo svg{width:14px;height:14px;flex:none;color:var(--lime)}
.swgo.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.swgo.on svg{color:var(--ink)}
.swx{height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.swx.armed{background:var(--coral);border-color:var(--coral);color:var(--ink)}
/* calendar */
.datenav .curdate{flex:none;width:auto;font:500 15px var(--mono);white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:44px;padding:0 12px;transition:border-color .12s}
.curdate:hover,.curdate[aria-expanded="true"]{border-color:var(--cyan)}
.cal{position:absolute;top:100%;left:0;right:0;z-index:10;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 18px 40px -12px #000}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead b{font:600 18px var(--cond)}
.calhead button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 18px var(--mono)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid span{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);text-align:center;padding:4px 0}
.calgrid button{position:relative;min-height:60px;padding:6px 2px 10px;border-radius:6px;border:1px solid transparent;background:var(--surface);font:500 16px var(--mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.calgrid button small{font:600 12px var(--cond);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.calgrid button small.lift{color:var(--cyan)}
.calgrid button small.soccer{color:var(--amber)}
.calgrid button.sel small{color:var(--ink)}
.calgrid button:hover{border-color:var(--text-dim)}
.calgrid button.today{color:var(--cyan);border-color:var(--cyan)}
.calgrid button.sel{background:var(--text);color:var(--ink);border-color:var(--text)}
.calgrid button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--lime)}

.qhero{text-align:center;padding:26px 16px;border:1px solid var(--lime);box-shadow:0 0 0 1px var(--lime),0 0 18px -4px var(--lime)}
.qclock{font:500 clamp(30px,8vw,58px)/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--lime);margin:8px 0}
.qstats b{color:var(--lime)}
.crave{border:1px dashed var(--magenta)}
.crave h3{color:var(--magenta)}
.crave .go{background:var(--magenta)}
.crave .go.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.cclock{font:500 clamp(40px,11vw,76px)/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--magenta);text-align:center;margin:6px 0 10px}
.ctip{text-align:center;font:600 20px/1.3 var(--cond);margin:0 auto 14px;max-width:30ch;text-wrap:balance}
.btn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.goalbar{height:18px;border-radius:999px;background:var(--bg);overflow:hidden;margin:10px 0}
.goalbar i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width .3s}
.miles{display:flex;flex-direction:column;gap:12px}
.mile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center}
.mile .mk{grid-row:1/3;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font:500 12px var(--mono);color:var(--text-dim)}
.mile.done .mk{background:var(--lime);color:var(--ink);font-size:18px}
.mile .mt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.mile .mt b{font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
.mile.done .mt b{color:var(--lime)}
.mile .meter{height:5px;background:var(--bg)}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--text-dim);font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:underline}
@media (max-width:560px){
  .btn3{grid-template-columns:1fr}
  .day{padding:6px 5px}
  .day .d2,.dots{display:none}
  .day .d1{flex-direction:column;align-items:center;gap:1px}
  .head h2{font-size:28px}
  .brand{font-size:19px}
  .seg button{font-size:14px;height:46px}
  .ex{padding:12px}
  .badge{width:40px;height:40px;font-size:17px}
  .set,.sethead{grid-template-columns:26px 56px minmax(0,1fr) 62px;gap:6px}
  .nokg .set,.nokg .sethead{grid-template-columns:26px 60px minmax(0,1fr)}
  .step{grid-template-columns:44px minmax(0,1fr) 44px;gap:4px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

nly guide the bell.", "calf": "Rise as high as you can, pause for a second, then lower the heels below the plate for a full stretch.", "legraise": "Hang still, raise straight legs to hip height, lower slowly. Bend the knees if you start to swing."};

/* ---------- state ---------- */
var logs={},body={},targets={},targetsAt=0,dirty={},pick={};
var db=null,dl=null,flushing=false,timer=null,armed="",localOk=true,cloud="none",note=null;
var cur=iso(new Date()),tab="lift";

var quit={start:"",perDay:null,packPrice:null,packSize:20,goalName:"",goalCost:null,at:0},qlog=[],qEdit=false,crave=0,quitInt=null,tipIx=0,qMsg="";

function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function dow(s){return (parse(s).getDay()+6)%7}
function nice(s){var d=parse(s);return WEEK[dow(s)][0]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){if(v===""||v==null)return null;var n=parseFloat(v);return isFinite(n)&&n>=0?Math.round(n*10)/10:null}
function key(date,sid){return date+"_"+sid}

/* ---------- storage: this tablet first, online copy second ---------- */
var LS="hgl2";
function snapshot(){return {logs:logs,body:body,targets:targets,targetsAt:targetsAt,quit:quit,qlog:qlog,times:times,notes:notes,soccer:soccer,plan:plan,qday:qday,meta:meta,dirty:Object.keys(dirty)}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(snapshot()));localOk=true}catch(e){localOk=false}showStatus()}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(LS)||"null");if(s){logs=s.logs||{};body=s.body||{};targets=s.targets||{};targetsAt=s.targetsAt||0;if(s.quit)quit=s.quit;if(s.qlog)qlog=s.qlog;if(s.times)times=s.times;if(s.notes)notes=s.notes;if(s.soccer)soccer=s.soccer;if(s.meta)meta=s.meta;if(s.plan)plan=s.plan;if(s.qday)qday=s.qday;(s.dirty||[]).forEach(function(p){dirty[p]=1})}}catch(e){localOk=false}}
function showStatus(){var el=$("status");el.hidden=localOk;el.textContent="Not saved";el.className="chip err"}
function dataFor(p){var i=p.indexOf("/"),c=p.slice(0,i),id=p.slice(i+1);
  if(c==="config")return {sets:targets,at:targetsAt};
  return c==="logs"?logs[id]:body[id]}
function mark(p){dirty[p]=1;saveLocal();if(!db)return;cloud="saving";showStatus();clearTimeout(timer);timer=setTimeout(flush,700)}
function flush(){
  if(!db||flushing)return;
  var paths=Object.keys(dirty);if(!paths.length){cloud="ok";showStatus();return}
  flushing=true;var p=paths[0],d=dataFor(p);delete dirty[p];
  if(!d){flushing=false;saveLocal();flush();return}
  db.doc(p).set(JSON.parse(JSON.stringify(d))).then(function(){flushing=false;saveLocal();flush()},function(e){
    flushing=false;dirty[p]=1;cloud="err";saveLocal();
    var code=e&&e.code;
    if(code==="unavailable"||code==="resource_exhausted"){clearTimeout(timer);timer=setTimeout(flush,8000)}
    else db=null})
}
function clone(s){return JSON.parse(JSON.stringify(s.data()))}
function mergeSet(local,remote,coll){var out={},id;
  for(id in remote){var l=local[id],r=remote[id];
    if(l&&(dirty[coll+"/"+id]||(l.at||0)>(r.at||0))){out[id]=l;dirty[coll+"/"+id]=1}else out[id]=r}
  for(id in local)if(!(id in remote)){out[id]=local[id];dirty[coll+"/"+id]=1}
  return out}
function pull(){
  if(!db)return;
  Promise.all([db.collection("logs").limit(1000).get(),db.collection("body").limit(1000).get(),db.doc("config/targets").get()]).then(function(r){
    var rl={},rb={};
    r[0].docs.forEach(function(s){rl[s.id]=clone(s)});
    r[1].docs.forEach(function(s){rb[s.id]=clone(s)});
    logs=mergeSet(logs,rl,"logs");body=mergeSet(body,rb,"body");
    if(r[2].exists){var c=clone(r[2]);if((c.at||0)>targetsAt&&!dirty["config/targets"]){targets=c.sets||{};targetsAt=c.at||0}else if(targetsAt>(c.at||0))dirty["config/targets"]=1}
    else if(targetsAt)dirty["config/targets"]=1;
    cloud="ok";saveLocal();render();flush();
  },function(){cloud="err";showStatus()})
}

var idb=null;
function idbOpen(cb){try{var r=indexedDB.open("gymlog",1);r.onupgradeneeded=function(){r.result.createObjectStore("photos",{keyPath:"date"})};r.onsuccess=function(){idb=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function idbPut(p){if(!idb)return;try{idb.transaction("photos","readwrite").objectStore("photos").put(p)}catch(e){}}

function addPhoto(file){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var m=1200,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var p={date:cur,data:c.toDataURL("image/jpeg",.82),at:Date.now()};photos[cur]=p;idbPut(p);render()};
  img.onerror=function(){URL.revokeObjectURL(url)};img.src=url}

/* ---------- log model ---------- */
function prevSets(ex,sid,date){var best=null,bd="";
  for(var k in logs){var l=logs[k];if(l.session!==sid||!(l.date<date)||!l.sets||!l.sets[ex.id])continue;
    if(!l.sets[ex.id].some(function(s){return s.a!=null}))continue;
    if(l.date>bd){bd=l.date;best=l.sets[ex.id]}}
  return best}
function monday(date){return shift(date,-dow(date))}
function planStart(){var first="";for(var k in logs){var l=logs[k];if(LIFTS.indexOf(l.session)<0)continue;var any=false;for(var e in l.sets||{})if(l.sets[e].some(function(q){return q.a!=null}))any=true;if(any&&(!first||l.date<first))first=l.date}return first}
function weekNo(date){var st=planStart();if(!st)return 0;var n=Math.round((parse(monday(date))-parse(monday(st)))/6048e5);return n<0?0:n%6+1}
function deloadWeek(date){return weekNo(date)===6}
function nSets(ex,sid,date){return LIFTS.indexOf(sid)>=0&&deloadWeek(date)?Math.ceil(ex.sets/2):ex.sets}
function viewSets(ex,sid,date){
  var l=logs[key(date,sid)];if(l&&l.sets&&l.sets[ex.id])return l.sets[ex.id];
  var prev=prevSets(ex,sid,date),t=targets[ex.id]||[],out=[];
  for(var i=0,n=nSets(ex,sid,date);i<n;i++)out.push({t:t[i]!=null?t[i]:ex.lo,a:null,w:prev&&prev[i]&&prev[i].w!=null?prev[i].w:null});
  return out}
function ownSets(ex,sid,date){
  var k=key(date,sid);if(!logs[k])logs[k]={date:date,session:sid,sets:{}};
  if(!logs[k].sets[ex.id])logs[k].sets[ex.id]=viewSets(ex,sid,date).map(function(s){return {t:s.t,a:s.a,w:s.w}});
  logs[k].at=Date.now();
  return logs[k].sets[ex.id]}
function tally(sets){var a=0,t=0,full=0;sets.forEach(function(s){t+=s.t||0;a+=Math.min(s.a||0,s.t||0);if(s.a!=null&&s.a>=s.t)full++});return {a:a,t:t,full:full}}
function isDone(ex,sid,date){var s=viewSets(ex,sid,date);return tally(s).full===s.length}
function progress(date,sid){var l=logs[key(date,sid)],a=0,t=0,any=false;
  ROUTINES[sid].ex.forEach(function(ex){if(ex.opt)return;var s=l&&l.sets&&l.sets[ex.id];
    if(s){var x=tally(s);a+=x.a;t+=x.t;if(s.some(function(q){return q.a!=null}))any=true}else t+=ex.lo*nSets(ex,sid,date)});
  return {pct:t?Math.round(100*a/t):0,any:any}}
function soccerDay(date){if(pick[date])return pick[date]==="soccer";
  var lifted=LIFTS.some(function(x){return !!logs[key(date,x)]});
  return (soccerDone(date)&&!lifted)||(!liftFor(date)&&WEEK[dow(date)][1]==="Soccer")}
function soccerDone(date){var g=soccer[date];return !!(g&&(g.min||g.rpe||g.goals||g.assists))}
function liftFor(date){
  if(pick[date]&&pick[date]!=="soccer")return pick[date];if(pick[date]==="soccer")return "";
  if(plan[date])return plan[date].sid;
  for(var i=0;i<LIFTS.length;i++)if(logs[key(date,LIFTS[i])])return LIFTS[i];
  return WEEK[dow(date)][2]}
function nextUp(sid,date){var a=ROUTINES[sid].ex;for(var i=0;i<a.length;i++)if(!a[i].opt&&!isDone(a[i],sid,date))return a[i].id;return ""}

/* ---------- render ---------- */
function renderTop(){
  $("curdate").textContent=nice(cur);swArmed=false;swRender();
  var mon=shift(cur,-dow(cur)),h="",today=iso(new Date());
  for(var i=0;i<7;i++){var d=shift(mon,i),w=WEEK[i],sid=liftFor(d)||"",p=sid?progress(d,sid):null;
    var mb=progress(d,"mob").any,pf=progress(d,"floor").any;
    h+='<button type="button" class="day'+(d===cur?" sel":"")+(sid?"":" off")+'" data-date="'+d+'" aria-label="'+DAYNAME[i]+" "+parse(d).getDate()+'">'+
      '<span class="d1"><span>'+w[0]+(d===today?" &bull;":"")+'</span><span>'+parse(d).getDate()+'</span></span>'+
      '<span class="d2">'+esc(sid?ROUTINES[sid].name:plan[d]&&plan[d].moved?"Skipped":w[1])+'</span>'+
      '<span class="meter"><i style="width:'+(p?p.pct:soccerDone(d)?100:0)+'%"></i></span>'+
      '<span class="dots"><span class="'+(mb?"on":"")+'">MOB</span><span class="'+(pf?"on":"")+'">PF</span></span></button>'}
  $("week").innerHTML=h;
  $("tabs").innerHTML=TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")
}

function history(ex,sid){var out=[];
  for(var k in logs){var l=logs[k];if(l.session!==sid||l.date>cur||!l.sets||!l.sets[ex.id])continue;
    var reps=0,vol=0,any=false;l.sets[ex.id].forEach(function(q){if(q.a!=null){any=true;reps+=q.a;vol+=q.a*(q.w||0)}});
    if(any)out.push({date:l.date,reps:reps,vol:vol})}

function trendHtml(ex,sid){

   '<span><b>'+Math.round(lastv)+(useVol?" kg":" reps")+'</b> '+(diff===0?"level":(diff>0?"up ":"down ")+Math.abs(Math.round(diff)))+" over "+h.length+" sessions</span></div>"}
function suggest(ex,sid){
  if(LIFTS.indexOf(sid)<0||ex.opt||deloadWeek(cur))return null;
  var l=logs[key(cur,sid)];if(l&&l.sets&&l.sets[ex.id])return null;
  var prev=prevSets(ex,sid,cur);if(!prev||prev.length<ex.sets)return null;
  if(prev.every(function(q){return q.a!=null&&q.a>=ex.hi}))return {label:(ex.kg?"Go up a weight, restart at ":"Add load, restart at ")+ex.lo,t:prev.map(function(){return ex.lo})};
  if(prev.every(function(q){return q.a!=null&&q.a>=q.t})){var t=prev.map(function(q){return Math.min(ex.hi,q.t+1)});
    if(t.some(function(v,i){return v>prev[i].t}))return {label:"Aim for "+Math.max.apply(null,t)+" today",t:t}}
  return null}
